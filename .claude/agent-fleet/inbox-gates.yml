# TODO(seam): a stub installed by the fleet kit. Replace it with what a change to THIS repo must run and show.
#
# `agent-fleet gates owed` reads this file and the diff, matches the changed paths to the
# kinds below, and lists every check, proof and skill those kinds owe. A path no kind
# matches falls to the built-in `other` kind (show: test, plus the check named `fast`).
# Every key is described in kits/fleet/GATES.md in the kit repo, and two complete
# manifests sit under kits/fleet/examples/ (web-app, turbot-core).
# `agent-fleet gates check` validates this file. `agent-fleet dispatcher mode live` refuses to leave
# dry-run while it has an error or any `# TODO(seam)` comment is left in it.

# needs:                   # what a check needs from the machine (kits/fleet/GATES.md § needs)
#   my-token: {env: MY_NPM_TOKEN}   # a secret the repo declares in agent-fleet.json; commit a project .npmrc that reads it.
#                                   # Never a `probe` that looks in the worker owner's ~/.npmrc or ~/.yarnrc: it
#                                   # breaks every other repo the worker serves, and `gates check` warns on it.
#                                   # (A probe for a login this machine keeps, such as ~/.config/x/credentials.yml, is fine.)
# never_run:               # commands a run must never execute: deploys, anything touching production
#   - make deploy*
# ignore:                  # paths that belong to no kind on purpose
#   - vendor/**

checks:
  fast: {run: "echo 'TODO(seam): name the quick check for this repo'; exit 1"}   # e.g. just test, npm test

kinds:
  code:
    paths: ["**"]          # TODO(seam): narrow this to the repo's source paths, and add a kind per area
    checks: [fast]
    show: [test]           # a test for the change, happy and unhappy path

