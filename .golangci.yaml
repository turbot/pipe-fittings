version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - copyloopvar
    - depguard
    - durationcheck
    - forbidigo
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - makezero
    - nilerr
    - nolintlint
    - reassign
    - sqlclosecheck
    - unconvert
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: go.uber.org/zap
              desc: do not use Uber zap directly, use the fplog package instead
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^(fmt\.Fprint(|f|ln)|print|println)$
        - pattern: ^zap\.Error$
        - pattern: ^grpc\.(Header|Trailer)$
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - assignOp
        - commentFormatting
    govet:
      disable:
        - inline
    gosec:
      excludes:
        - G122
        - G703
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - SA*
        - S1*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: pipeparser/utils/user_input.go
      - linters:
          - gosec
        path: (connection/connection_test|sanitize/sanitizer_test)\.go
        text: "G101: Potential hardcoded credentials: (Password in URL|GitHub personal access token)"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
